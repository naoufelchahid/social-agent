name: Python tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run offline tests with coverage
        run: uv run pytest -m "not live" --cov=social_media_agent --cov-report=term-missing
