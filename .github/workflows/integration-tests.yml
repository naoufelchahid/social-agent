name: Mocked end-to-end test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mocked-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Run the offline end-to-end workflow
        run: uv run pytest -m "not live" tests/e2e/test_local_pipeline.py -q
